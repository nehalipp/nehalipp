<svg width="280" height="130" viewBox="0 0 280 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="65 thousand dollars plus in pricing discrepancies identified" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="280" height="130" rx="8" fill="#101B2D"/>
  <rect x="0" y="0" width="6" height="0" fill="#F2A93B">
    <animate attributeName="height" from="0" to="130" dur="0.45s" begin="0s" fill="freeze"/>
  </rect>
  <g fill="#F2A93B" opacity="0.55">
    <rect x="196" y="32" width="7" height="0"><animate attributeName="y" from="32" to="16" dur="0.35s" begin="0.00s" fill="freeze"/><animate attributeName="height" from="0" to="16" dur="0.35s" begin="0.00s" fill="freeze"/></rect>
    <rect x="207" y="32" width="7" height="0"><animate attributeName="y" from="32" to="6" dur="0.35s" begin="0.08s" fill="freeze"/><animate attributeName="height" from="0" to="26" dur="0.35s" begin="0.08s" fill="freeze"/></rect>
    <rect x="218" y="32" width="7" height="0"><animate attributeName="y" from="32" to="20" dur="0.35s" begin="0.16s" fill="freeze"/><animate attributeName="height" from="0" to="12" dur="0.35s" begin="0.16s" fill="freeze"/></rect>
    <rect x="229" y="32" width="7" height="0"><animate attributeName="y" from="32" to="2" dur="0.35s" begin="0.24s" fill="freeze"/><animate attributeName="height" from="0" to="30" dur="0.35s" begin="0.24s" fill="freeze"/></rect>
    <rect x="240" y="32" width="7" height="0"><animate attributeName="y" from="32" to="12" dur="0.35s" begin="0.32s" fill="freeze"/><animate attributeName="height" from="0" to="20" dur="0.35s" begin="0.32s" fill="freeze"/></rect>
  </g>
  <text x="26" y="66" font-family="Verdana, Geneva, sans-serif" font-size="30" font-weight="bold" fill="#EDEFF2" opacity="1">$0
    <set attributeName="opacity" to="0" begin="0.22s"/>
  </text>
  <text x="26" y="66" font-family="Verdana, Geneva, sans-serif" font-size="30" font-weight="bold" fill="#EDEFF2" opacity="0">$20K
    <set attributeName="opacity" to="1" begin="0.22s"/>
    <set attributeName="opacity" to="0" begin="0.44s"/>
  </text>
  <text x="26" y="66" font-family="Verdana, Geneva, sans-serif" font-size="30" font-weight="bold" fill="#EDEFF2" opacity="0">$40K
    <set attributeName="opacity" to="1" begin="0.44s"/>
    <set attributeName="opacity" to="0" begin="0.66s"/>
  </text>
  <text x="26" y="66" font-family="Verdana, Geneva, sans-serif" font-size="30" font-weight="bold" fill="#EDEFF2" opacity="0">$65K+
    <set attributeName="opacity" to="1" begin="0.66s" fill="freeze"/>
  </text>
  <text x="26" y="90" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#9FB0BF">Pricing discrepancies</text>
  <text x="26" y="106" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#9FB0BF">found at FedEx</text>
