<svg width="280" height="130" viewBox="0 0 280 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="5 plus years in data and BI analytics" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="280" height="130" rx="8" fill="#14213D"/>
  <rect x="0" y="0" width="6" height="0" fill="#FF7A59">
    <animate attributeName="height" from="0" to="130" dur="0.45s" begin="0s" fill="freeze"/>
  </rect>
  <g fill="#FF7A59" opacity="0.65">
    <rect x="206" y="32" width="7" height="0"><animate attributeName="y" from="32" to="24" dur="0.35s" begin="0.00s" fill="freeze"/><animate attributeName="height" from="0" to="8" dur="0.35s" begin="0.00s" fill="freeze"/></rect>
    <rect x="217" y="32" width="7" height="0"><animate attributeName="y" from="32" to="18" dur="0.35s" begin="0.08s" fill="freeze"/><animate attributeName="height" from="0" to="14" dur="0.35s" begin="0.08s" fill="freeze"/></rect>
    <rect x="228" y="32" width="7" height="0"><animate attributeName="y" from="32" to="10" dur="0.35s" begin="0.16s" fill="freeze"/><animate attributeName="height" from="0" to="22" dur="0.35s" begin="0.16s" fill="freeze"/></rect>
    <rect x="239" y="32" width="7" height="0"><animate attributeName="y" from="32" to="16" dur="0.35s" begin="0.24s" fill="freeze"/><animate attributeName="height" from="0" to="16" dur="0.35s" begin="0.24s" fill="freeze"/></rect>
    <rect x="250" y="32" width="7" height="0"><animate attributeName="y" from="32" to="2" dur="0.35s" begin="0.32s" fill="freeze"/><animate attributeName="height" from="0" to="30" dur="0.35s" begin="0.32s" fill="freeze"/></rect>
  </g>
  <text x="26" y="66" font-family="Verdana, Geneva, sans-serif" font-size="36" font-weight="bold" fill="#F5F7FA" opacity="1">0
    <set attributeName="opacity" to="0" begin="0.20s"/>
  </text>
  <text x="26" y="66" font-family="Verdana, Geneva, sans-serif" font-size="36" font-weight="bold" fill="#F5F7FA" opacity="0">1
    <set attributeName="opacity" to="1" begin="0.20s"/>
    <set attributeName="opacity" to="0" begin="0.40s"/>
  </text>
  <text x="26" y="66" font-family="Verdana, Geneva, sans-serif" font-size="36" font-weight="bold" fill="#F5F7FA" opacity="0">3
    <set attributeName="opacity" to="1" begin="0.40s"/>
    <set attributeName="opacity" to="0" begin="0.60s"/>
  </text>
  <text x="26" y="66" font-family="Verdana, Geneva, sans-serif" font-size="36" font-weight="bold" fill="#F5F7FA" opacity="0">5+
    <set attributeName="opacity" to="1" begin="0.60s" fill="freeze"/>
  </text>
  <text x="26" y="90" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#8891A3">Years in data &amp;</text>
  <text x="26" y="106" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#8891A3">BI analytics</text>
</svg>
