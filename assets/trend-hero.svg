<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An upward trending line, drawing itself in" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="150" rx="10" fill="#14213D"/>
  <line x1="20" y1="130" x2="880" y2="130" stroke="#8891A3" stroke-width="1" opacity="0.35"/>
  <line x1="20" y1="10" x2="20" y2="130" stroke="#8891A3" stroke-width="1" opacity="0.35"/>

  <path d="M30,110 L130,95 L230,100 L330,70 L430,80 L530,45 L630,55 L730,25 L830,15"
        fill="none" stroke="#FF7A59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="820" stroke-dashoffset="820">
    <animate attributeName="stroke-dashoffset" from="820" to="0" dur="1.8s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </path>

  <circle r="5" fill="#FF7A59">
    <animateMotion dur="1.8s" begin="0.1s" fill="freeze"
      path="M30,110 L130,95 L230,100 L330,70 L430,80 L530,45 L630,55 L730,25 L830,15"/>
  </circle>

  <circle cx="830" cy="15" r="4" fill="none" stroke="#29C7C9" stroke-width="2" opacity="0">
    <set attributeName="opacity" to="0.7" begin="1.9s"/>
    <animate attributeName="r" from="4" to="14" dur="1.6s" begin="1.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.7" to="0" dur="1.6s" begin="1.9s" repeatCount="indefinite"/>
  </circle>
</svg>
