<svg width="850" height="230" viewBox="0 0 850 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Top 5 tools by frequency across roles and projects: SQL 7, Tableau 6, Python 4, Excel 3, Power BI 2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="850" height="230" rx="10" fill="#14213D"/>

  <text x="24" y="42" font-family="Verdana, Geneva, sans-serif" font-size="15" fill="#F5F7FA">SQL</text>
  <rect x="160" y="28" width="0" height="18" rx="4" fill="#FF7A59"><animate attributeName="width" from="0" to="600" dur="0.6s" begin="0.00s" fill="freeze"/></rect>
  <text x="770" y="42" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#8891A3" opacity="0">7<set attributeName="opacity" to="1" begin="0.55s"/></text>

  <text x="24" y="82" font-family="Verdana, Geneva, sans-serif" font-size="15" fill="#F5F7FA">Tableau</text>
  <rect x="160" y="68" width="0" height="18" rx="4" fill="#29C7C9"><animate attributeName="width" from="0" to="514" dur="0.6s" begin="0.10s" fill="freeze"/></rect>
  <text x="684" y="82" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#8891A3" opacity="0">6<set attributeName="opacity" to="1" begin="0.65s"/></text>

