  <text x="513" y="122" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#8891A3" opacity="0">4<set attributeName="opacity" to="1" begin="0.75s"/></text>

  <text x="24" y="162" font-family="Verdana, Geneva, sans-serif" font-size="15" fill="#F5F7FA">Excel</text>
  <rect x="160" y="148" width="0" height="18" rx="4" fill="#29C7C9"><animate attributeName="width" from="0" to="257" dur="0.6s" begin="0.30s" fill="freeze"/></rect>
  <text x="427" y="162" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#8891A3" opacity="0">3<set attributeName="opacity" to="1" begin="0.85s"/></text>

  <text x="24" y="202" font-family="Verdana, Geneva, sans-serif" font-size="15" fill="#F5F7FA">Power BI</text>
