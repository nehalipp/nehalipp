<svg width="280" height="130" viewBox="0 0 280 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2 million plus HMIS records validated" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="280" height="130" rx="8" fill="#14213D"/>
  <rect x="0" y="0" width="6" height="0" fill="#29C7C9">
    <animate attributeName="height" from="0" to="130" dur="0.45s" begin="0s" fill="freeze"/>
  </rect>
  <g fill="#29C7C9" opacity="0.65">
    <rect x="196" y="32" width="7" height="0"><animate attributeName="y" from="32" to="4" dur="0.35s" begin="0.00s" fill="freeze"/><animate attributeName="height" from="0" to="28" dur="0.35s" begin="0.00s" fill="freeze"/></rect>
    <rect x="207" y="32" width="7" height="0"><animate attributeName="y" from="32" to="14" dur="0.35s" begin="0.08s" fill="freeze"/><animate attributeName="height" from="0" to="18" dur="0.35s" begin="0.08s" fill="freeze"/></rect>
    <rect x="218" y="32" width="7" height="0"><animate attributeName="y" from="32" to="8" dur="0.35s" begin="0.16s" fill="freeze"/><animate attributeName="height" from="0" to="24" dur="0.35s" begin="0.16s" fill="freeze"/></rect>
    <rect x="229" y="32" width="7" height="0"><animate attributeName="y" from="32" to="20" dur="0.35s" begin="0.24s" fill="freeze"/><animate attributeName="height" from="0" to="12" dur="0.35s" begin="0.24s" fill="freeze"/></rect>
    <rect x="240" y="32" width="7" height="0"><animate attributeName="y" from="32" to="0" dur="0.35s" begin="0.32s" fill="freeze"/><animate attributeName="height" from="0" to="32" dur="0.35s" begin="0.32s" fill="freeze"/></rect>
  </g>
  <text x="26" y="66" font-family="Verdana, Geneva, sans-serif" font-size="32" font-weight="bold" fill="#F5F7FA" opacity="1">0
    <set attributeName="opacity" to="0" begin="0.20s"/>
  </text>
  <text x="26" y="66" font-family="Verdana, Geneva, sans-serif" font-size="32" font-weight="bold" fill="#F5F7FA" opacity="0">0.5M
    <set attributeName="opacity" to="1" begin="0.20s"/>
    <set attributeName="opacity" to="0" begin="0.40s"/>
  </text>
  <text x="26" y="66" font-family="Verdana, Geneva, sans-serif" font-size="32" font-weight="bold" fill="#F5F7FA" opacity="0">1M
    <set attributeName="opacity" to="1" begin="0.40s"/>
    <set attributeName="opacity" to="0" begin="0.60s"/>
  </text>
  <text x="26" y="66" font-family="Verdana, Geneva, sans-serif" font-size="32" font-weight="bold" fill="#F5F7FA" opacity="0">1.5M
    <set attributeName="opacity" to="1" begin="0.60s"/>
    <set attributeName="opacity" to="0" begin="0.80s"/>
  </text>
  <text x="26" y="66" font-family="Verdana, Geneva, sans-serif" font-size="32" font-weight="bold" fill="#F5F7FA" opacity="0">2M+
    <set attributeName="opacity" to="1" begin="0.80s" fill="freeze"/>
  </text>
  <text x="26" y="90" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#8891A3">HMIS records</text>
  <text x="26" y="106" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#8891A3">validated in Tableau</text>
</svg>
